name: CI/CD — Notification Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  ci:
    name: 🧪 CI — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código fuente
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Verificar tipos TypeScript
        run: npx tsc --noEmit

      - name: 🧪 Ejecutar pruebas
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_for_ci
          BREVO_API_KEY: test_brevo_key
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 🏗️ Compilar TypeScript → JavaScript
        run: npm run build

  deploy:
    name: 🚀 Deploy → Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 Disparar deploy en Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION }}"
          echo " → Notification Service deploy enviado"

      - name: ✅ Deploy completado
        run: echo "🎉 Notification Service desplegado en Render"
